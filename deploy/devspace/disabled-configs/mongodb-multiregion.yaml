apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: mongodb-multiregion
  namespace: dev
spec:
  members: 3
  type: ReplicaSet
  version: "6.0.5"
  replicaSetHorizons:
    - horizon: "external"
      members:
        - "mongodb-0.mongodb-svc.dev.svc.cluster.local:27017"
        - "mongodb-1.mongodb-svc.dev.svc.cluster.local:27017"
        - "mongodb-2.mongodb-svc.dev.svc.cluster.local:27017"
    - horizon: "internal"
      members:
        - "mongodb-0.internal.company.com:27017"
        - "mongodb-1.internal.company.com:27017"
        - "mongodb-2.internal.company.com:27017"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: demo
      db: admin
      passwordSecretRef:
        name: user-password
      roles:
        - name: clusterAdmin
          db: admin
        - name: userAdminAnyDatabase
          db: admin
        - name: dbAdminAnyDatabase
          db: admin
        - name: readWriteAnyDatabase
          db: admin
      scramCredentialsSecretName: user
  statefulSet:
    spec:
      template:
        spec:
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchExpressions:
                        - key: app
                          operator: In
                          values:
                            - mongodb-svc
                    topologyKey: topology.kubernetes.io/zone
  additionalMongodConfig:
    storage.wiredTiger.engineConfig.journalCompressor: zlib
    replication.enableMajorityReadConcern: true
    net.compression.compressors: "snappy,zstd,zlib"

---
apiVersion: v1
kind: Secret
metadata:
  name: user-password
  namespace: dev
type: Opaque
stringData:
  password: spectrocloud

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-external
  namespace: dev
spec:
  type: LoadBalancer
  selector:
    app: mongodb-svc
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP 