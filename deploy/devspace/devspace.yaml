version: v2beta1
name: dadjokes

vars:
  OPENAI_API_KEY:
    source: env
  TAG:
    source: command
    command: git rev-parse --short HEAD
  NAMESPACE: ${DEVSPACE_NAMESPACE}
  JOKE_SERVER: vfiftyfive/joke-server:latest
  JOKE_WORKER: vfiftyfive/joke-worker:latest
  REGION:
    source: env
    default: "milan"
  MONGODB_MEMBERS:
    source: env
    default: "3"  # 3 for Milan, 2 for Dublin
  
  # MongoDB Connection Variables
  MONGO_USERNAME:
    source: env
    default: "demo"
  MONGO_PASSWORD:
    source: env
    default: "spectrocloud"
  MONGO_DATABASE:
    source: env
    default: "jokesdb"
  MONGO_REPLICA_SET:
    source: env
    default: "mongodb"
  MONGO_HOSTS:
    source: env
    default: "mongodb-0.mongodb-svc.dev.svc.cluster.local:27017,mongodb-1.mongodb-svc.dev.svc.cluster.local:27017,mongodb-2.mongodb-svc.dev.svc.cluster.local:27017"
  MONGO_READ_PREFERENCE:
    source: env
    default: "primaryPreferred"
  MONGO_MAX_STALENESS_SECONDS:
    source: env
    default: "90"
  MONGO_SSL:
    source: env
    default: "false"
  MONGO_AUTH_MECHANISM:
    source: env
    default: ""

# This is a list of `pipelines` that DevSpace can execute (you can define your own)
pipelines:
  # This is the pipeline for the main command: `devspace dev` (or `devspace run-pipeline dev`)
  dev:
    run: |-
      run_dependencies --all     
      ensure_pull_secrets --all
      create_deployments mongodb-operator redis-operator
      create_deployments mongodb-config custom-resources nats joke-server joke-worker ingress
      start_dev --all
  deploy:
    run: |-
      run_dependencies --all
      ensure_pull_secrets --all
      build_images --all -t ${TAG} -t latest
      create_deployments mongodb-operator redis-operator
      create_deployments mongodb-config custom-resources nats joke-server joke-worker ingress
      if [ "${REGION}" = "dublin" ]; then
        echo "Deploying MongoDB join job for Dublin..."
        create_deployments mongodb-join-milan
      fi
  build:
    run: |-
      run_dependencies --all
      build_images --all -t ${TAG} -t latest
# This is a list of `images` that DevSpace can build for this project
# We recommend to skip image building during development (devspace dev) as much as possible
images:
  joke-server:
    image: ${JOKE_SERVER}
    dockerfile: ../../cmd/joke-server/Dockerfile
    context: ../..
  joke-worker:
    image: ${JOKE_WORKER}
    dockerfile: ../../cmd/joke-worker/Dockerfile
    context: ../..

# This is a list of `deployments` that DevSpace can create for this project
deployments:
  mongodb-operator:
    helm:
      chart:
        name: community-operator
        repo: https://mongodb.github.io/helm-charts
  redis-operator:
    helm:
      chart:
        name: redis-operator
        repo: https://ot-container-kit.github.io/helm-charts/
  nats:
    helm:
      chart:
        name: nats
        repo: https://nats-io.github.io/k8s/helm/charts/
  joke-server:
    # This deployment uses `helm` but you can also define `kubectl` deployments or kustomizations
    helm:
      # We are deploying this project with the Helm chart you provided
      chart:
        name: component-chart
        repo: https://charts.devspace.sh
      # Under `values` we can define the values for this Helm chart used during `helm install/upgrade`
      # You may also use `valuesFiles` to load values from files, e.g. valuesFiles: ["values.yaml"]
      values:
        containers:
          - image: ${JOKE_SERVER}
            ports:
              - containerPort: 8080
            env:
              - name: NATS_URL
                value: nats://nats:4222
              - name: REGION
                value: ${REGION}
              - name: RATINGS_STORAGE_PATH
                value: /data/ratings
            envFrom:
              - configMapRef:
                  name: mongodb-connection
              - secretRef:
                  name: mongodb-admin-demo
                  prefix: MONGO_
            volumeMounts:
              - containerPath: /data/ratings
                volume:
                  name: ratings-storage
                  readOnly: false
            livenessProbe:
              httpGet:
                path: /livez
                port: 8080
              initialDelaySeconds: 10
              periodSeconds: 10
            readinessProbe:
              httpGet:
                path: /readyz
                port: 8080
              initialDelaySeconds: 5
              periodSeconds: 5
            startupProbe:
              httpGet:
                path: /startz
                port: 8080
              initialDelaySeconds: 0
              periodSeconds: 5
              failureThreshold: 30
        volumes:
          - name: ratings-storage
            size: 1Gi
            storageClassName: gp3
        service:
          ports:
            - port: 8080
  joke-worker:
    # This deployment uses `helm` but you can also define `kubectl` deployments or kustomizations
    helm:
      # We are deploying this project with the Helm chart you provided
      chart:
        name: component-chart
        repo: https://charts.devspace.sh
      # Under `values` we can define the values for this Helm chart used during `helm install/upgrade`
      # You may also use `valuesFiles` to load values from files, e.g. valuesFiles: ["values.yaml"]
      values:
        containers:
          - image: ${JOKE_WORKER}
            env:
              - name: NATS_URL
                value: nats://nats:4222
              - name: REDIS_URL
                value: redis:6379
              - name: OPENAI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: openai-api-key
                    key: OPENAI_API_KEY
            envFrom:
              - configMapRef:
                  name: mongodb-connection
              - secretRef:
                  name: mongodb-admin-demo
                  prefix: MONGO_
  custom-resources:
    kubectl:
      manifests:
        - custom-resources/mongodb-rbac.yaml
        - custom-resources/mongodb-admin-secret.yaml
        - custom-resources/redis.yaml
        - custom-resources/mongodb-${REGION}.yaml
        - custom-resources/mongodb-nlb-${REGION}.yaml
  mongodb-config:
    kubectl:
      inlineManifest: |
        ---
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: mongodb-connection
          namespace: ${NAMESPACE}
        data:
          MONGO_USERNAME: "${MONGO_USERNAME}"
          MONGO_PASSWORD: "${MONGO_PASSWORD}"
          MONGO_DATABASE: "${MONGO_DATABASE}"
          MONGO_REPLICA_SET: "${MONGO_REPLICA_SET}"
          MONGO_HOSTS: "${MONGO_HOSTS}"
          MONGO_READ_PREFERENCE: "${MONGO_READ_PREFERENCE}"
          MONGO_MAX_STALENESS_SECONDS: "${MONGO_MAX_STALENESS_SECONDS}"
          MONGO_SSL: "${MONGO_SSL}"
          MONGO_AUTH_MECHANISM: ""
          # Legacy configuration
          MONGO_HOST: mongodb-svc
          MONGO_PORT: "27017"
          MONGO_FAILOVER_TIMEOUT: "30"
          MONGO_RETRY_WRITES: "true"
  mongodb-join-milan:
    kubectl:
      manifests:
        - custom-resources/mongodb-dublin-join-milan.yaml
  ingress:
    kubectl:
      manifests:
        - ingress.yaml

# This is a list of `dev` containers that are based on the containers created by your deployments
dev:
  joke-server:
    imageSelector: ${JOKE_SERVER}
    ports:
      - port: "8080"
  joke-worker:
    imageSelector: ${JOKE_WORKER}
    command: ["./joke-worker"]
    restartHelper:
      inject: true
    # add envFrom with JSON patch
    # patches:
    # - op: add
    #   path: spec.containers[0].envFrom
    #   value:
    #     - configmapRef:
    #         name: openai-api-key
    sync:
      - path: ../../cmd/joke-worker:/app/cmd/joke-worker
        onUpload:
          restartContainer: true
          exec:
            - command: |-
                go build -o joke-worker ./cmd/joke-worker/main.go
      - path: ../../go.mod:/app/go.mod
      - path: ../../go.sum:/app/go.sum
      - path: ../../internal:/app/internal
        onUpload:
          restartContainer: true
          exec:
            - command: |-
                go build -o joke-worker ./cmd/joke-worker/main.go

hooks:
  - name: "Decrypt OPENAI_API_KEY"
    command: "sops -d openai-api-key.enc.yaml | sed '/data: |/d' | kubectl apply -n ${NAMESPACE} -f -"
    events: ["before:deploy"]
  - name: "Annotate MongoDB service for external-dns"
    command: |
      echo "Waiting for MongoDB service to be created..."
      kubectl wait --for=condition=ready pod -l app=mongodb-svc -n ${NAMESPACE} --timeout=120s || true
      echo "Patching mongodb-svc with external-dns annotations..."
      if [ "${REGION}" = "milan" ]; then
        kubectl annotate svc mongodb-svc -n ${NAMESPACE} --overwrite \
          external-dns.alpha.kubernetes.io/hostname="milan.mongodb.internal.k8sdr.com" \
          external-dns.alpha.kubernetes.io/ttl="60" || true
      else
        kubectl annotate svc mongodb-svc -n ${NAMESPACE} --overwrite \
          external-dns.alpha.kubernetes.io/hostname="dublin.mongodb.internal.k8sdr.com" \
          external-dns.alpha.kubernetes.io/ttl="60" || true
      fi
    events: ["after:deploy:custom-resources"]
  - name: "Delete redis resources"
    command: "kubectl delete -n ${NAMESPACE} redis --all"
    events: ["before:purge"]
  - name: "Delete PVCs"
    command: "kubectl delete -n ${NAMESPACE} pvc --all"
    events: ["after:purge"]

commands:
  encrypt-openai-secret: |-
    kubectl create secret generic openai-api-key \
        --from-literal=OPENAI_API_KEY=${OPENAI_API_KEY} \
        --dry-run=client -o yaml > openai-secret.yaml && \
    sops -e openai-secret.yaml > openai-api-key.enc.yaml && \
    rm openai-secret.yaml
