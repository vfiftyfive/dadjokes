apiVersion: apps/v1
kind: Deployment
metadata:
  name: joke-server
  namespace: dev
  labels:
    app: joke-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: joke-server
  template:
    metadata:
      labels:
        app: joke-server
    spec:
      containers:
      - name: joke-server
        image: vfiftyfive/joke-server:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: NATS_URL
          value: "nats://nats:4222"
        - name: MONGO_URL
          value: "mongodb://demo:spectrocloud@mongodb-svc:27017"
        - name: REDIS_URL
          value: "redis:6379"
        - name: REGION
          value: "${REGION}"
        - name: RATINGS_STORAGE_PATH
          value: "/data/ratings"
        volumeMounts:
        - name: ratings-storage
          mountPath: /data/ratings
        livenessProbe:
          httpGet:
            path: /livez
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /startz
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 5
          failureThreshold: 30
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: ratings-storage
        persistentVolumeClaim:
          claimName: ratings-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: joke-server
  namespace: dev
  labels:
    app: joke-server
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: joke-server
---
apiVersion: v1
kind: Service
metadata:
  name: joke-server-headless
  namespace: dev
  labels:
    app: joke-server
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: joke-server 